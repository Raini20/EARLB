# sm2mm-Pipeline: simplemap (Keyframes von MOLA-LO) -> globale Punktwolke fuer CloudCompare
# Basis: mp2p_icp_core/demos/sm2mm_pointcloud_voxelize.yaml (MOLAorg/mp2p_icp)
# Unterschiede: Linear-Deskew als Default, Nahbereichsfilter fuer Bediener/Stab statt 5 m.
#  SM2MM_DESKEW_METHOD  MotionCompensationMethod::{None,Linear,IMU}  (Default Linear)
#  SM2MM_VOXEL_SIZE     Voxelgroesse je Keyframe [m]                   (Default 0.02)
#  SM2MM_MIN_RANGE      Punkte naeher als dieser Wert verwerfen [m]   (Default 0.8)
generators:
  - class_name: mp2p_icp_filters::Generator
    params:
      filterOutPointsAtZero: true

filters:
  - class_name: mp2p_icp_filters::FilterAdjustTimestamps
    params:
      pointcloud_layer: "raw"
      silently_ignore_no_timestamps: true
      method: "TimestampAdjustMethod::MiddleIsZero"

  - class_name: mp2p_icp_filters::FilterDeskew
    params:
      input_pointcloud_layer: "raw"
      output_pointcloud_layer: "deskewed"
      method: MotionCompensationMethod::Linear
      ignore_accelerometer: true
      output_layer_class: "mrpt::maps::CGenericPointsMap"
      twist: [vx, vy, vz, wx, wy, wz]
      points_already_global: true
      robot_pose: [robot_x, robot_y, robot_z, robot_yaw, robot_pitch, robot_roll]

  - class_name: mp2p_icp_filters::FilterDecimateVoxels
    params:
      input_pointcloud_layer: "deskewed"
      output_pointcloud_layer: "decimated"
      voxel_filter_resolution: 0.05
      decimate_method: DecimateMethod::FirstPoint

  - class_name: mp2p_icp_filters::FilterByRange
    params:
      input_pointcloud_layer: "decimated"
      output_layer_outside: "map"
      range_min: 0.0
      range_max: 0.8
      center: [robot_x, robot_y, robot_z]

  - class_name: mp2p_icp_filters::FilterDeleteLayer
    params:
      pointcloud_layer_to_remove: ["raw", "deskewed", "decimated"]
